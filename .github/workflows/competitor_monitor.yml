name: Competitor Intelligence Weekly Digest

on:
  schedule:
    # Runs every Monday at 08:00 UTC (09:00 AM UK time)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write # Required to persist database state back to repo

jobs:
  track-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitoring & Send Slack Briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LLM_PROVIDER: "claude"
        run: |
          python main.py run-all --slack

      - name: Persist Database State & Latest Briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intel.db reports/latest_briefing.md reports/latest_briefing.html
          git diff --staged --quiet || git commit -m "chore: persist competitor snapshot state [skip ci]"
          git push

      - name: Archive Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-reports
          path: reports/
          retention-days: 14
