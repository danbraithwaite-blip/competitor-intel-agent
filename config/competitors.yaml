# ==============================================================================
# TARGET COMPANY PROFILE
# This profile instructs the AI (Claude) to analyze competitor moves specifically
# through the lens of how they impact Veremark's business, sales, and product.
# ==============================================================================
company:
  name: "Veremark"
  description: "Global pre-employment screening, credential verification, and background checking platform."
  core_offerings:
    - "Identity verification (IDV) and biometric checks"
    - "Global criminal record checks, adverse media, and sanctions screening"
    - "Employment history, education, and credential verification"
    - "Automated digital reference checking (Autocheck)"
    - "Continuous workforce monitoring and compliance"
    - "ATS and HRIS integrations (Greenhouse, Workday, Lever, Ashby, BambooHR)"
  strategic_focus_areas:
    - "Pricing per check, package bundling, subscription vs pay-as-you-go"
    - "Turnaround times and international SLA guarantees"
    - "New ATS/HRIS integrations and partner ecosystem updates"
    - "Regulatory compliance changes (GDPR, FCRA, UK DBS, Right to Work)"
    - "AI-driven screening features and candidate experience workflows"

